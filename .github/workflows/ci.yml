name: moonbit-ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Enforce MoonBit compiler version
        run: |
          required="0.10.9"
          actual="$(moon version --all | awk '/^moonc / {print $2}' | sed 's/^v//' | cut -d+ -f1)"
          echo "required moonc >= ${required}, actual ${actual}"
          if [ "$(printf '%s\n' "$required" "$actual" | sort -V | head -n1)" != "$required" ]; then
            echo "moonc is too old"
            exit 1
          fi

      - name: Format check
        run: moon fmt --check

      - name: Static check
        run: moon check --deny-warn

      - name: Build
        run: moon build

      - name: Test
        run: moon test --deny-warn

      - name: Interface info
        run: moon info

      - name: Run main example
        run: moon run cmd/main

      - name: Run library example
        run: moon run examples/partial
